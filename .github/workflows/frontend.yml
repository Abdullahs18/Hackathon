name: Frontend integration
on:
  push:
    branches: ["integration/**"]
  pull_request:
    paths: ["hackathon frontend/**", "backend/**", "contracts/**", ".github/workflows/frontend.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hackathon frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hackathon frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: hackathon frontend/test-results/
          retention-days: 3
