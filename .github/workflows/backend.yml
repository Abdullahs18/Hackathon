name: Backend checks
on:
  push:
    branches: [be]
  pull_request:
    paths: ["backend/**", "contracts/**", "compose.yaml", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dastak
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dastak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dastak -d dastak_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app migrations tests
      - run: ruff format --check app migrations tests
      - name: SQLite regression
        run: python -m pytest -q
      - name: PostgreSQL migrations, constraints and API regression
        env:
          TEST_DATABASE_URL: postgresql+psycopg://dastak:ci-only-password@localhost:5432/dastak_test
        run: python -m pytest -q
      - name: Validate Compose configuration
        working-directory: .
        env:
          POSTGRES_PASSWORD: ci-only-password
          DASTAK_JWT_SECRET: ci-only-secret-with-at-least-32-characters
          DASTAK_DEMO_PASSWORD: ci-only-demo-password
        run: docker compose config --quiet
      - name: Build backend image
        working-directory: .
        run: docker build -t dastak-backend:ci . -f backend/Dockerfile
      - name: Verify private evidence volume as application user
        working-directory: .
        env:
          POSTGRES_PASSWORD: ci-only-password
          DASTAK_JWT_SECRET: ci-only-secret-with-at-least-32-characters
          DASTAK_DEMO_PASSWORD: ci-only-demo-password
        run: |
          docker compose run --rm --no-deps api python -c "import os; from pathlib import Path; from app.evidence_storage import EvidenceStore; assert os.getuid() == 10001; s=EvidenceStore(Path('storage/evidence')); s.check(); s.write('0'*32+'.blob',b'synthetic')"
          docker compose run --rm --no-deps api python -c "import os, hashlib; from pathlib import Path; from app.evidence_storage import EvidenceStore; assert os.getuid() == 10001; s=EvidenceStore(Path('storage/evidence')); k='0'*32+'.blob'; assert s.read(k,9,hashlib.sha256(b'synthetic').hexdigest()) == b'synthetic'; s.remove(k)"
      - name: Verify bundled browser-audio decoder as application user
        working-directory: .
        run: docker run --rm dastak-backend:ci python -c "import os; assert os.getuid() == 10001; from app.voice.decoder_check import main; main()"
