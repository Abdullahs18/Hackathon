components:
  schemas:
    ConsentDataScope:
      type: string
      enum:
      - case_status
      - incident_data
      - evidence
      - incident_data.incident_type
      - incident_data.incident_date
      - incident_data.description
      - incident_data.scam_message
      - incident_data.platform
      - incident_data.money_lost
      - incident_data.amount
      - incident_data.currency
      - incident_data.payment_method
      - incident_data.transaction_reference
      - incident_data.suspect_details
      - incident_data.citizen_confirmed_corrections
      - identity_reference
      - voice_audio
      - voice_transcript
      - spoken_text
      description: case_status shares the case envelope. incident_data shares incident fields except evidence_ids;
        evidence shares evidence IDs/access. Individual incident_data.field scopes narrow incident sharing.
        These are data scopes, separate from API-key scopes.
    ConsentPurpose:
      type: string
      enum:
      - helper_assistance
      - complaint_submission
      - mock_identity_check
      - mock_payment_lookup
      - mock_requirements_lookup
      - voice_processing
      - speech_synthesis
      - speech_translation
      description: helper_assistance uses user:<helper_id>; complaint_submission uses workspace:<id>.
        Mock purposes use service:mock-identity, service:mock-payment and service:mock-data respectively.
        voice_processing uses service:gemini-voice; speech_synthesis uses service:gtts;
        speech_translation uses service:gemini-speech with spoken_text scope.
    HelperGrantCreate:
      type: object
      additionalProperties: false
      required:
      - helper_id
      properties:
        helper_id:
          type: string
          minLength: 1
          maxLength: 100
    OfficerAssignmentCreate:
      type: object
      additionalProperties: false
      required:
      - officer_id
      properties:
        officer_id:
          type: string
          minLength: 1
          maxLength: 100
    AdminAssignmentCase:
      type: object
      additionalProperties: false
      required: [complaint_id, submission_reference, destination_workspace_id, current_status, review_outcome, submitted_at, assigned_officer_id, recipient_consent_active]
      properties:
        complaint_id:
          type: string
          format: uuid
        submission_reference:
          type: string
          maxLength: 100
        destination_workspace_id:
          type: string
          maxLength: 100
        current_status:
          type: string
          enum: [SUBMITTED, OFFICER_REVIEW]
        review_outcome:
          $ref: '#/components/schemas/ReviewOutcome'
        submitted_at:
          type: string
          format: date-time
        assigned_officer_id:
          type: string
          nullable: true
          maxLength: 100
        recipient_consent_active:
          type: boolean
    EligibleAssignmentOfficer:
      type: object
      additionalProperties: false
      required: [user_id, workspace_id]
      properties:
        user_id:
          type: string
          maxLength: 100
        workspace_id:
          type: string
          maxLength: 100
    AdminAssignmentQueue:
      type: object
      additionalProperties: false
      description: Administrative filing metadata only. No citizen identity, incident facts, draft, evidence, voice or tool payloads.
      required: [items, officers, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdminAssignmentCase'
        officers:
          type: array
          items:
            $ref: '#/components/schemas/EligibleAssignmentOfficer'
        next_cursor:
          type: string
          format: uuid
          nullable: true
    VoiceExtraction:
      type: object
      description: Unconfirmed extracted incident suggestions, a plain Urdu summary and uncertainties.
        Used by the provider proof and persisted saved-case assessment. Validate and obtain citizen corrections
        before applying suggestions; never grants consent or filing authority.
      additionalProperties: false
      required:
      - incident_data
      - spoken_summary_ur
      - uncertainties
      properties:
        incident_data:
          $ref: '#/components/schemas/IncidentInformation'
        spoken_summary_ur:
          type: string
          minLength: 1
          maxLength: 2000
        uncertainties:
          type: array
          items:
            type: string
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      - simulated
      properties:
        status:
          type: string
          enum:
          - ok
        simulated:
          type: boolean
          enum:
          - true
    Role:
      type: string
      enum:
      - Citizen
      - Helper
      - Officer
      - Admin
    WorkflowStatus:
      type: string
      enum:
      - DRAFT
      - COLLECT_INFORMATION
      - VOICE_TRANSCRIPTION
      - STRUCTURED_EXTRACTION
      - CLASSIFICATION
      - VALIDATION
      - NEEDS_INFORMATION
      - HUMAN_REVIEW
      - ROUTING_RULE_EVALUATION
      - COMPLAINT_GENERATION
      - CITIZEN_REVIEW
      - CONSENT_AND_AUTHORIZATION
      - AGENT_EXECUTION
      - MOCK_SERVICE_CALLS
      - SUBMISSION_VERIFICATION
      - SUBMITTED
      - OFFICER_REVIEW
      - RESOLVED
    ConsentStatus:
      type: string
      enum:
      - granted
      - withdrawn
    OfficerAction:
      type: string
      enum:
      - request_information
      - accept
      - reject
      - escalate
      - close
    ClassificationResult:
      type: object
      additionalProperties: false
      required:
      - incident_type
      - confidence
      - suspicious_indicators
      - explanation
      - missing_fields
      - contradiction_flags
      properties:
        incident_type:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        suspicious_indicators:
          type: array
          items:
            type: string
        explanation:
          type: string
        missing_fields:
          type: array
          items:
            type: string
        contradiction_flags:
          type: array
          items:
            type: string
      x-pydantic-source: "from pydantic import BaseModel, Field\n\nclass ClassificationResult(BaseModel):\n\
        \    incident_type: str\n    confidence: float = Field(ge=0, le=1)\n    suspicious_indicators:\
        \ list[str]\n    explanation: str\n    missing_fields: list[str]\n    contradiction_flags: list[str]\n"
    ComplaintDraft:
      type: object
      additionalProperties: false
      required:
      - incident_type
      - incident_date
      - description
      - amount
      - currency
      - payment_method
      - transaction_reference
      - suspect_details
      - evidence_ids
      - citizen_confirmed
      properties:
        incident_type:
          type: string
        incident_date:
          type: string
          description: Exact or approximate date as supplied.
          nullable: true
        description:
          type: string
        amount:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        payment_method:
          type: string
          nullable: true
        transaction_reference:
          type: string
          nullable: true
        suspect_details:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            type: string
        citizen_confirmed:
          type: boolean
      x-pydantic-source: "from pydantic import BaseModel\n\nclass ComplaintDraft(BaseModel):\n    incident_type:\
        \ str\n    incident_date: str | None\n    description: str\n    amount: float | None\n    currency:\
        \ str | None\n    payment_method: str | None\n    transaction_reference: str | None\n    suspect_details:\
        \ list[str]\n    evidence_ids: list[str]\n    citizen_confirmed: bool\n"
    IncidentInformation:
      type: object
      description: Partial incident record. Omit uncollected fields. Use null for unknown values. An approximate
        date may be supplied as text.
      additionalProperties: false
      properties:
        incident_type:
          type: string
          maxLength: 200
          nullable: true
        incident_date:
          type: string
          maxLength: 12000
          description: Exact or approximate date as supplied.
          nullable: true
        description:
          type: string
          maxLength: 12000
          nullable: true
        scam_message:
          type: string
          maxLength: 12000
          nullable: true
        platform:
          type: string
          maxLength: 12000
          nullable: true
        money_lost:
          type: boolean
          nullable: true
        amount:
          type: number
          nullable: true
        currency:
          type: string
          maxLength: 12000
          nullable: true
        payment_method:
          type: string
          maxLength: 12000
          nullable: true
        transaction_reference:
          type: string
          maxLength: 12000
          nullable: true
        suspect_details:
          type: array
          maxItems: 100
          items:
            type: string
          description: Reported phone numbers, URLs, accounts or profiles.
          nullable: true
        evidence_ids:
          type: array
          maxItems: 100
          items:
            type: string
          nullable: true
        citizen_confirmed_corrections:
          type: array
          maxItems: 100
          items:
            type: string
          nullable: true
    HelperInformation:
      type: object
      description: Information supplied under an active grant. Only the citizen can confirm corrections.
      additionalProperties: false
      properties:
        incident_type:
          type: string
          maxLength: 200
          nullable: true
        incident_date:
          type: string
          maxLength: 12000
          description: Exact or approximate date as supplied.
          nullable: true
        description:
          type: string
          maxLength: 12000
          nullable: true
        scam_message:
          type: string
          maxLength: 12000
          nullable: true
        platform:
          type: string
          maxLength: 12000
          nullable: true
        money_lost:
          type: boolean
          nullable: true
        amount:
          type: number
          nullable: true
        currency:
          type: string
          maxLength: 12000
          nullable: true
        payment_method:
          type: string
          maxLength: 12000
          nullable: true
        transaction_reference:
          type: string
          maxLength: 12000
          nullable: true
        suspect_details:
          type: array
          maxItems: 100
          items:
            type: string
          description: Reported phone numbers, URLs, accounts or profiles.
          nullable: true
        evidence_ids:
          type: array
          maxItems: 100
          items:
            type: string
          nullable: true
      minProperties: 1
    users:
      type: object
      additionalProperties: false
      required:
      - user_id
      - role
      - workspace_id
      properties:
        user_id:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
        workspace_id:
          type: string
          minLength: 1
          nullable: true
    workspaces:
      type: object
      additionalProperties: false
      required:
      - workspace_id
      - name
      properties:
        workspace_id:
          type: string
          minLength: 1
        name:
          type: string
    complaints:
      type: object
      description: citizen_id references users.user_id. Routing sets destination_workspace_id and pins
        the immutable rule_version_id. Both are null before a route is selected.
      additionalProperties: false
      required:
      - complaint_id
      - citizen_id
      - destination_workspace_id
      - rule_version_id
      - current_status
      - incident_data
      properties:
        version:
          type: integer
          minimum: 1
          description: Saved complaint revision for incident changes and analysis/status updates; returned
            as a quoted ETag.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        complaint_id:
          type: string
          minLength: 1
        citizen_id:
          type: string
          minLength: 1
        destination_workspace_id:
          type: string
          minLength: 1
          nullable: true
        rule_version_id:
          type: string
          minLength: 1
          nullable: true
        current_status:
          $ref: '#/components/schemas/WorkflowStatus'
        incident_type:
          type: string
          nullable: true
          description: Duplicates incident_data.incident_type so routing queries can filter a plain column
            without querying the JSON record.
        incident_data:
          $ref: '#/components/schemas/IncidentInformation'
        complaint_draft:
          $ref: '#/components/schemas/ComplaintDraft'
        authorization_id:
          type: string
          nullable: true
        agent_run_id:
          type: string
          nullable: true
        submission_reference:
          type: string
          nullable: true
        review_outcome:
          $ref: '#/components/schemas/ReviewOutcome'
    complaint_access_grants:
      type: object
      additionalProperties: false
      required:
      - complaint_id
      - helper_id
      - active
      properties:
        complaint_id:
          type: string
          minLength: 1
        helper_id:
          type: string
          minLength: 1
        active:
          type: boolean
    case_assignments:
      type: object
      description: The assigned officer and case must belong to this workspace.
      additionalProperties: false
      required:
      - complaint_id
      - officer_id
      - workspace_id
      properties:
        complaint_id:
          type: string
          minLength: 1
        officer_id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
    evidence:
      type: object
      description: Citizen-submitted original; not authenticity-verified. This metadata never contains
        a public URL or private storage path.
      additionalProperties: false
      required:
      - evidence_id
      - complaint_id
      - uploader_id
      - timestamp
      - file_name
      - file_type
      - file_size
      - sha256
      - verification_status
      properties:
        evidence_id:
          type: string
          minLength: 1
        complaint_id:
          type: string
          minLength: 1
        uploader_id:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        file_name:
          type: string
          maxLength: 200
        file_type:
          type: string
          enum:
          - image/png
          - image/jpeg
          - image/webp
          - application/pdf
        file_size:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Bytes.
        sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        verification_status:
          type: string
          enum:
          - not_authenticity_verified
    ConsentGrant:
      type: object
      additionalProperties: false
      required:
      - recipient
      - purpose
      - data_scopes
      properties:
        recipient:
          type: string
          minLength: 1
          maxLength: 150
          description: user:<helper_user_id> for helper_assistance; workspace:<workspace_id> for complaint_submission.
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        data_scopes:
          type: array
          items:
            $ref: '#/components/schemas/ConsentDataScope'
          minItems: 1
          uniqueItems: true
    ConsentChange:
      type: object
      additionalProperties: false
      properties:
        recipient:
          type: string
          minLength: 1
          maxLength: 150
          description: user:<helper_user_id> for helper_assistance; workspace:<workspace_id> for complaint_submission.
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        data_scopes:
          type: array
          items:
            $ref: '#/components/schemas/ConsentDataScope'
          minItems: 1
          uniqueItems: true
      minProperties: 1
    consents:
      type: object
      additionalProperties: false
      required:
      - consent_id
      - complaint_id
      - citizen_id
      - recipient
      - purpose
      - data_scopes
      - status
      - granted_at
      - changed_at
      - withdrawn_at
      properties:
        consent_id:
          type: string
          minLength: 1
        complaint_id:
          type: string
          minLength: 1
        citizen_id:
          type: string
          minLength: 1
        recipient:
          type: string
          minLength: 1
          maxLength: 150
          description: user:<helper_user_id> for helper_assistance; workspace:<workspace_id> for complaint_submission.
        purpose:
          $ref: '#/components/schemas/ConsentPurpose'
        data_scopes:
          type: array
          items:
            $ref: '#/components/schemas/ConsentDataScope'
          minItems: 1
          uniqueItems: true
        status:
          $ref: '#/components/schemas/ConsentStatus'
        granted_at:
          type: string
          format: date-time
        changed_at:
          type: string
          format: date-time
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          nullable: true
    RuleCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - incident_type
      - destination_workspace_id
      - priority
      - active
      - explanation
      - justification
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        incident_type:
          type: string
          enum: &id001
          - fake aid scam
          - phishing
          - impersonation
          - fraudulent transfer
          - other suspected online financial fraud
          description: Supported subtype within the one suspected-online-financial-fraud workflow. Exact
            classifier-label match.
        destination_workspace_id:
          type: string
          minLength: 1
          enum:
          - mock-financial-fraud
          - mock-digital-safety
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: Lower number evaluates first; ties use ascending rule_id.
        active:
          type: boolean
        explanation:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
        justification:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
    RuleChange:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        incident_type:
          type: string
          enum: *id001
          description: Supported subtype within the one suspected-online-financial-fraud workflow. Exact
            classifier-label match.
        destination_workspace_id:
          type: string
          minLength: 1
          enum:
          - mock-financial-fraud
          - mock-digital-safety
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: Lower number evaluates first; ties use ascending rule_id.
        active:
          type: boolean
        explanation:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
        justification:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
      minProperties: 1
    routing_rule_versions:
      type: object
      description: Immutable snapshot. created_by references the Admin user.
      additionalProperties: false
      required:
      - rule_id
      - rule_version_id
      - name
      - incident_type
      - destination_workspace_id
      - priority
      - active
      - explanation
      - justification
      - created_by
      - timestamp
      properties:
        rule_id:
          type: string
          minLength: 1
        rule_version_id:
          type: string
          minLength: 1
        name:
          type: string
        incident_type:
          type: string
        destination_workspace_id:
          type: string
          minLength: 1
        priority:
          type: integer
        active:
          type: boolean
        explanation:
          type: string
        justification:
          type: string
        created_by:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
    routing_rules:
      type: object
      description: Current definition and its active version identifier. Edits create immutable snapshots.
      additionalProperties: false
      required:
      - rule_id
      - rule_version_id
      - name
      - incident_type
      - destination_workspace_id
      - priority
      - active
      - explanation
      - justification
      - created_by
      - timestamp
      properties:
        rule_id:
          type: string
          minLength: 1
        rule_version_id:
          type: string
          minLength: 1
        name:
          type: string
        incident_type:
          type: string
        destination_workspace_id:
          type: string
          minLength: 1
        priority:
          type: integer
        active:
          type: boolean
        explanation:
          type: string
        justification:
          type: string
        created_by:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
    agent_runs:
      type: object
      additionalProperties: false
      required:
      - agent_run_id
      - complaint_id
      - citizen_id
      - language
      - transcript
      - incident_data
      - classification
      - readiness_score
      - missing_fields
      - contradiction_flags
      - rule_version_id
      - destination_workspace_id
      - consent_granted
      - citizen_authorized
      - idempotency_key
      - submission_reference
      - current_status
      - errors
      properties:
        agent_run_id:
          type: string
          minLength: 1
        complaint_id:
          type: string
          minLength: 1
        citizen_id:
          type: string
          minLength: 1
        language:
          type: string
        transcript:
          type: string
          nullable: true
        incident_data:
          $ref: '#/components/schemas/IncidentInformation'
        classification:
          oneOf:
          - $ref: '#/components/schemas/ClassificationResult'
          - type: object
            nullable: true
            enum:
            - null
        readiness_score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        missing_fields:
          type: array
          items:
            type: string
        contradiction_flags:
          type: array
          items:
            type: string
        rule_version_id:
          type: string
          minLength: 1
          nullable: true
        destination_workspace_id:
          type: string
          minLength: 1
          nullable: true
        consent_granted:
          type: boolean
        citizen_authorized:
          type: boolean
        idempotency_key:
          type: string
          minLength: 1
        submission_reference:
          type: string
          nullable: true
        current_status:
          $ref: '#/components/schemas/WorkflowStatus'
        errors:
          type: array
          items:
            type: string
        authorization_id:
          type: string
        next_step:
          type: string
        warnings:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    agent_actions:
      type: object
      description: Sanitized summaries of individual agent actions and tool calls.
      additionalProperties: false
      required:
      - agent_action_id
      - agent_run_id
      - action
      - input
      - result
      - timestamp
      properties:
        agent_action_id:
          type: string
          minLength: 1
        agent_run_id:
          type: string
          minLength: 1
        action:
          type: string
        input:
          type: string
        result:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    submissions:
      type: object
      additionalProperties: false
      required:
      - submission_id
      - complaint_id
      - idempotency_key
      - submission_reference
      - result
      - timestamp
      properties:
        submission_id:
          type: string
          minLength: 1
        complaint_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
        submission_reference:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
    SubmissionConfirmation:
      type: object
      description: Confirmed simulated submission.
      additionalProperties: false
      required:
      - complaint_id
      - idempotency_key
      - submission_reference
      - simulated
      properties:
        complaint_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
        submission_reference:
          type: string
          minLength: 1
        simulated:
          type: boolean
          enum:
          - true
    SubmissionRequest:
      type: object
      additionalProperties: false
      required:
      - complaint_id
      - complaint_draft
      properties:
        complaint_id:
          type: string
          minLength: 1
        complaint_draft:
          $ref: '#/components/schemas/ComplaintDraft'
    audit_logs:
      type: object
      description: Admin-safe metadata projection, never the raw stored audit input/result. Input contains
        validated metadata only; result is a fixed explanation. Unknown actions and private fields are
        redacted.
      additionalProperties: false
      required:
      - audit_log_id
      - complaint_id
      - user_id
      - agent_run_id
      - action
      - input
      - result
      - rule_version_id
      - timestamp
      properties:
        audit_log_id:
          type: string
          minLength: 1
        complaint_id:
          type: string
          minLength: 1
          nullable: true
        user_id:
          type: string
          minLength: 1
          nullable: true
        agent_run_id:
          type: string
          minLength: 1
          nullable: true
        action:
          type: string
        input:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        rule_version_id:
          type: string
          minLength: 1
          nullable: true
