openapi: 3.0.3
info:
  title: Dastak REST API
  version: 1.0.0
  description: Synthetic demo data and simulated services only. Each protected operation
    accepts a frontend JWT or a scoped external API key bound to an authorized principal.
    Keys must be unexpired and unrevoked. API key scopes are grouped by resource area.
    Every request enforces role, resource, workspace and current consent checks as
    applicable.
tags:
- name: Health
  description: Check process liveness and database readiness. No user or case data
    is returned.
- name: Authentication
  description: Sign in and view the current account.
- name: Citizen complaints
  description: Create, update and track complaints, attach evidence and authorize
    submission.
- name: Consent
  description: View, grant, change and withdraw consent to share complaint data.
- name: Evidence
  description: Upload original supporting files and retrieve them with current case
    permission and consent.
- name: Helper
  description: Track and add information to cases covered by an active helper grant.
- name: Officer
  description: Review assigned complaints and record decisions.
- name: Admin
  description: Manage users, routing rules and API keys, and inspect audit records
    and agent runs.
- name: Mock services
  description: Look up simulated records and reporting requirements, submit complaints
    and check confirmations.
- name: Notifications
  description: List personal notifications and mark them as read.
security:
- BearerAuth: []
- ApiKeyAuth: []
paths:
  /api/v1/complaints/{id}/helper-grants:
    parameters: &id002
    - &id001
      $ref: '#/components/parameters/complaint_idPath'
    get:
      tags:
      - Helper
      operationId: listHelperGrants
      summary: List helper grants
      description: Citizen owner only. A grant alone does not authorize sharing; current
        consent is also required.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas.yaml#/components/schemas/complaint_access_grants
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Helper
      operationId: grantHelperAccess
      summary: Grant case-specific helper access
      description: Citizen owner only. Creates or explicitly reactivates a helper
        grant. Existing grants return 200. Consent is a separate required gate.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaint_access_grants
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaint_access_grants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/HelperGrantCreate
  /api/v1/complaints/{id}/helper-grants/{helper_id}/revoke:
    parameters:
    - *id001
    - name: helper_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    post:
      tags:
      - Helper
      operationId: revokeHelperAccess
      summary: Revoke helper access
      description: Citizen owner only. Idempotently blocks future helper access even
        if consent remains granted.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaint_access_grants
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/admin/complaints/{id}/assignment:
    parameters: *id002
    post:
      tags:
      - Admin
      operationId: assignOfficer
      summary: Assign an officer to a submitted case
      description: 'Admin. Requires an already submitted/reviewing case, pinned route,
        active officer in the routed workspace, and current workspace consent. Returns
        assignment metadata only; conveys no access to incident data. API-key scope:
        admin:cases.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/case_assignments
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/OfficerAssignmentCreate
  /api/v1/health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: Process is running. All reporting services are simulated.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Health
  /api/v1/health/ready:
    get:
      tags:
      - Health
      operationId: getReadiness
      summary: Check database connectivity and current migration readiness
      security: []
      responses:
        '200':
          description: Database is accessible and all current migrations are applied.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Health
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Authenticate
      description: Public login for Citizen, Helper, Officer and Admin using their
        own credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/Login
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/LoginResult
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          description: Too many login attempts. Retry-After gives the delay in seconds.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Error
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      operationId: getMe
      summary: Get the signed-in account
      description: Citizen, Helper, Officer or Admin. Returns the calling account.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/users
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/complaints:
    post:
      tags:
      - Citizen complaints
      operationId: createComplaint
      summary: Create a complaint draft
      description: Citizen. The authenticated citizen owns the new draft. Optional
        Idempotency-Key prevents duplicate draft creation on retries. Identical replay
        returns the current draft with 200; conflicting reuse returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/IncidentInformation
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '409':
          $ref: '#/components/responses/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Use one opaque key for retries of the same citizen's draft creation.
          A different payload with the same key conflicts.
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      tags:
      - Citizen complaints
      operationId: listComplaints
      summary: List my complaints
      description: Citizen. Returns only the caller’s own cases.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas.yaml#/components/schemas/complaints
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    get:
      tags:
      - Citizen complaints
      operationId: getComplaint
      summary: Read a complaint
      description: Citizen who owns the case or Helper with a specific active grant
        and applicable consent. Return only information the caller may read.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Citizen complaints
      operationId: updateComplaint
      summary: Correct or complete a draft
      description: Citizen who owns the case. Omitted fields remain unchanged. Explicit
        null records an unknown value. Citizen edits in HUMAN_REVIEW may correct facts
        and return the case to DRAFT; they do not resolve review or authorize submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/IncidentPatch
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - name: If-Match
        in: header
        required: false
        description: Optional quoted content version, e.g. "1". A stale version returns
          412. On retry after an uncertain save, GET the draft and reconcile before
          retrying.
        schema:
          type: string
  /api/v1/complaints/{id}/evidence:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    post:
      tags:
      - Citizen complaints
      operationId: uploadEvidence
      summary: Attach supporting evidence
      description: Citizen owner or specifically granted Helper with current case_status
        and evidence consent. New uploads require an editable draft. Exactly one PNG/JPEG/WebP/static
        PDF file, at most 10 MiB, 20 megapixels or 25 PDF pages, at most 10 files
        per case. Decode/parse original bytes with bounded resources; reject encrypted/interactive
        PDFs. Preserve original privately, record SHA-256, invalidate generated review
        and update draft version. No OCR or authenticity verdict. Use an Idempotency-Key
        for safe retries; identical replay returns 200, conflicting reuse 409. Current
        permission/consent is always rechecked, including retries. Citizen edits in
        HUMAN_REVIEW may correct facts and return the case to DRAFT; they do not resolve
        review or authorize submission.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: ./schemas.yaml#/components/schemas/EvidenceUpload
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/evidence
          headers:
            X-Complaint-Version:
              description: Current complaint content version after upload/replay.
              schema:
                type: string
                pattern: ^[1-9][0-9]*$
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '200':
          description: Authorized metadata; not authenticity-verified.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/evidence
          headers:
            X-Complaint-Version:
              description: Current complaint content version after upload/replay.
              schema:
                type: string
                pattern: ^[1-9][0-9]*$
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Opaque retry key bound to uploader, case, original bytes, detected
          type and sanitized filename.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: If-Match
        in: header
        required: false
        description: Optional quoted complaint version, e.g. "1"; a stale new upload
          is 412. Identical idempotent replay does not change the case.
        schema:
          type: string
    get:
      tags:
      - Citizen complaints
      operationId: listEvidence
      summary: List authorized evidence metadata
      description: Citizen owner, specifically granted Helper, or assigned Officer
        in the matching workspace. Helper/Officer require current case_status and
        evidence consent. Recheck every request; Admin has no bypass.
      responses:
        '200':
          description: Authorized metadata; not authenticity-verified.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas.yaml#/components/schemas/evidence
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/evidence/{evidence_id}:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    - name: evidence_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    get:
      tags:
      - Citizen complaints
      operationId: getEvidence
      summary: Read authorized evidence metadata
      description: Citizen owner, specifically granted Helper, or assigned Officer
        in the matching workspace. Helper/Officer require current case_status and
        evidence consent. Recheck every request; Admin has no bypass.
      responses:
        '200':
          description: Authorized metadata; not authenticity-verified.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/evidence
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/evidence/{evidence_id}/content:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    - name: evidence_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    get:
      tags:
      - Citizen complaints
      operationId: downloadEvidence
      summary: Download an authorized original evidence file
      description: Citizen owner, specifically granted Helper, or assigned Officer
        in the matching workspace. Helper/Officer require current case_status and
        evidence consent. Recheck every request; Admin has no bypass. Serve a bounded
        byte snapshot as an attachment after verifying stored size/hash. No public
        or reusable signed URLs; no inline evidence rendering. Already received copies
        cannot be retracted.
      responses:
        '200':
          description: Private original bytes; not authenticity-verified.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Evidence-SHA256:
              schema:
                type: string
                pattern: ^[a-f0-9]{64}$
            X-Evidence-Verification:
              schema:
                type: string
                enum:
                - not_authenticity_verified
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/analyze:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    post:
      tags:
      - Citizen complaints
      operationId: analyzeComplaint
      summary: Analyze the saved incident
      description: Owning Citizen only; explicit allow_external_processing=true is
        required. Saved incident data is assessed by Gemini, excluding evidence IDs
        and citizen-confirmation records; evidence bytes are never sent. Input is
        limited to 24000 Unicode characters and needs description or scam_message.
        Validated extraction remains an unconfirmed preview. Database rules match
        the classifier subtype, ordered by priority then rule_id, and pin an immutable
        version. A pinned route is preserved across rule edits; missing/invalid/mismatched
        pins, no match, low readiness, unresolved contradictions or possible duplicates
        force HUMAN_REVIEW. Otherwise missing required facts or readiness below 0.85
        produce NEEDS_INFORMATION; complete cases at least 0.85 get a structured,
        unconfirmed CITIZEN_REVIEW draft. Optional unknown dates/references are not
        mandatory. No consent, citizen confirmation or submission is inferred. Current
        results are cached. Unrouted results are reevaluated when the rule catalog
        changes; validated saved assessments are reused without another provider call.
        Provider calls release DB locks and recheck account/version before saving;
        concurrent same-case work returns 429. Optional If-Match guards the saved
        revision.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/Analysis
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/AnalysisRequest
      parameters:
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
        description: Quoted current complaint ETag, e.g. "1". Stale requests return
          412.
  /api/v1/complaints/{id}/authorize-submission:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    post:
      tags:
      - Citizen complaints
      operationId: authorizeSubmission
      summary: Authorize the reviewed complaint
      description: Owning Citizen only. Confirm citizen_confirmed=true and citizen_authorized=true
        for reviewed_version. Requires a current CITIZEN_REVIEW draft, valid pinned
        route, no hard stops, and current scoped consent for the destination and each
        required simulated service. Binds the exact payload and relevant consent snapshots.
        Replays of the same active approval return the current case. Never files by
        itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/AuthorizeSubmission
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/consents:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    get:
      tags:
      - Consent
      operationId: listConsents
      summary: List case consent records
      description: Citizen who owns the complaint.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas.yaml#/components/schemas/consents
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Consent
      operationId: grantConsent
      summary: Grant data-sharing consent
      description: Citizen who owns the complaint. Derive the grantor from the authenticated
        citizen. One active consent per complaint/recipient/purpose is allowed; duplicate
        grants return 409. Recipient and purpose use the shared namespaced format
        and controlled enums. case_status is required to expose the case envelope;
        incident fields are filtered to the remaining scopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/ConsentGrant
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/consents
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/consents/{id}:
    parameters:
    - $ref: '#/components/parameters/consent_idPath'
    patch:
      tags:
      - Consent
      operationId: changeConsent
      summary: Change a consent record
      description: Citizen who owns the associated complaint. Apply the changed recipient,
        purpose or scope immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/ConsentChange
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/consents
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/consents/{id}/withdraw:
    parameters:
    - $ref: '#/components/parameters/consent_idPath'
    post:
      tags:
      - Consent
      operationId: withdrawConsent
      summary: Withdraw consent
      description: Citizen who owns the associated complaint. Block future access
        under this consent immediately and record withdrawal.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/consents
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/helper/complaints:
    get:
      tags:
      - Helper
      operationId: listHelperComplaints
      summary: Track authorized complaints
      description: Helper. Include only cases covered by a specific active grant and
        current consent. Filter each case to the authorized data scope.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas.yaml#/components/schemas/complaints
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/helper-information:
    parameters:
