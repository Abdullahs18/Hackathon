  /api/v1/admin/api-keys:
    get:
      tags: [Admin]
      operationId: listApiKeys
      summary: List API key metadata
      description: 'Admin. Lists scopes, expiration and revocation.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/ApiKeyMetadata'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      operationId: createApiKey
      summary: Issue a scoped API key
      description: Admin. Bind the key to the issuing principal and approved scopes. Return the secret at issuance and store only its hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ApiKeyIssued'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/admin/api-keys/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/api_key_idPath'
    post:
      tags: [Admin]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Admin. Subsequent uses of the revoked key fail authentication.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ApiKeyMetadata'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/mock/identity/{reference}:
    parameters:
      - $ref: '#/components/parameters/identity_referencePath'
    get:
      tags: [Mock services]
      operationId: getMockIdentity
      summary: Look up a simulated identity
      description: 'Admin within authorized mock-service scope, or an allowlisted agent acting for the Citizen on their own case. Bind the synthetic reference to the relevant user and check consent.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/mock_identity_records'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/mock/payments/transactions/{reference}:
    parameters:
      - $ref: '#/components/parameters/transaction_referencePath'
    get:
      tags: [Mock services]
      operationId: getMockPayment
      summary: Look up a simulated transaction
      description: 'Admin within authorized mock-service scope, or an allowlisted agent acting for the Citizen on their own case. Check consent and case scope. For a missing fixture, 404 carries error = not_found. A lookup miss does not invalidate the reported transaction.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/mock_payment_transactions'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/mock/data/requirements/{incident_type}:
    parameters:
      - $ref: '#/components/parameters/incident_typePath'
    get:
      tags: [Mock services]
      operationId: getMockRequirements
      summary: Read simulated reporting requirements
      description: 'Admin within mock-service scope, or an allowlisted agent acting for the Citizen on their own case.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/mock_reporting_requirements'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/mock/complaints:
    post:
      tags: [Mock services]
      operationId: submitMockComplaint
      summary: Submit an authorized simulated complaint
      description: 'Citizen through the allowlisted agent acting on the owner’s explicit authorization. Check current consent and validate the reviewed draft. Bind the key to the caller, complaint and authorized payload. Atomically record a single result. Reuse the prior result for an identical replay and return 409 for a conflicting reuse. After an uncertain outcome, check by key before retrying. Admin management conveys no filing authority.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/SubmissionRequest'
      responses:
        '200':
          description: Prior confirmation for an identical replay.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/SubmissionConfirmation'
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/SubmissionConfirmation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Reuse this opaque key for retries of the same authorized submission.
          schema:
            type: string
            minLength: 1
  /api/v1/mock/complaints/by-idempotency-key/{key}:
    parameters:
      - $ref: '#/components/parameters/idempotency_keyPath'
    get:
      tags: [Mock services]
      operationId: findMockSubmission
      summary: Check a simulated submission before retry
      description: 'Citizen through the allowlisted agent acting for the owner, or Admin within authorized mock-service scope. Check caller, complaint access and active consent before returning the prior confirmation.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/SubmissionConfirmation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List my notifications
      description: 'Citizen, Helper, Officer or Admin. Only the caller’s notifications, subject to current case access.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/notifications'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/notification_idPath'
    post:
      tags: [Notifications]
      operationId: readNotification
      summary: Mark a notification as read
      description: 'Citizen, Helper, Officer or Admin. Only the recipient with current access may mark the notification as read.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/notifications'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scopes grant access by resource area, such as complaints:read or admin:rules. A key carries only the authority of its principal.
  parameters:
    complaint_idPath:
      name: id
      in: path
      required: true
      description: Identifies complaint_id.
      schema:
        type: string
        minLength: 1
    consent_idPath:
      name: id
      in: path
      required: true
      description: Identifies consent_id.
      schema:
        type: string
        minLength: 1
    rule_idPath:
      name: id
      in: path
      required: true
      description: Identifies rule_id.
      schema:
        type: string
        minLength: 1
    api_key_idPath:
      name: id
      in: path
      required: true
      description: Identifies api_key_id.
      schema:
        type: string
        minLength: 1
    identity_referencePath:
      name: reference
      in: path
      required: true
      description: Identifies identity_reference.
      schema:
        type: string
        minLength: 1
    transaction_referencePath:
      name: reference
      in: path
      required: true
      description: Identifies transaction_reference.
      schema:
        type: string
        minLength: 1
    incident_typePath:
      name: incident_type
      in: path
      required: true
      description: Identifies incident_type.
      schema:
        type: string
        minLength: 1
    idempotency_keyPath:
      name: key
      in: path
      required: true
      description: Identifies idempotency_key.
      schema:
        type: string
        minLength: 1
    notification_idPath:
      name: id
      in: path
      required: true
      description: Identifies notification_id.
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: 'The HTTP status identifies the failure. 400 indicates invalid input, 401 invalid credentials, 403 insufficient authority or consent, 404 a missing resource, and 409 a conflicting request or case state. The body contains a machine-readable error and a safe explanation.'
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/components/schemas/Error'
