openapi: 3.0.3
info:
  title: Dastak REST API
  version: 1.0.0
  description: 'Synthetic demo data and simulated services only. Each protected operation accepts a frontend JWT or a scoped external API key bound to an authorized principal. Keys must be unexpired and unrevoked. API key scopes are grouped by resource area. Every request enforces role, resource, workspace and current consent checks as applicable.'
tags:
  - name: Health
    description: Check process liveness and database readiness. No user or case data is returned.
  - name: Authentication
    description: Sign in and view the current account.
  - name: Citizen complaints
    description: Create, update and track complaints, attach evidence and authorize submission.
  - name: Consent
    description: View, grant, change and withdraw consent to share complaint data.
  - name: Helper
    description: Track and add information to cases covered by an active helper grant.
  - name: Officer
    description: Review assigned complaints and record decisions.
  - name: Admin
    description: Manage users, routing rules and API keys, and inspect audit records and agent runs.
  - name: Mock services
    description: Look up simulated records and reporting requirements, submit complaints and check confirmations.
  - name: Notifications
    description: List personal notifications and mark them as read.
security:
  - BearerAuth: []
  - ApiKeyAuth: []
paths:
  /api/v1/complaints/{id}/helper-grants:
    parameters: &id002
    - &id001
      $ref: '#/components/parameters/complaint_idPath'
    get:
      tags:
      - Helper
      operationId: listHelperGrants
      summary: List helper grants
      description: Citizen owner only. A grant alone does not authorize sharing; current
        consent is also required.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas.yaml#/components/schemas/complaint_access_grants
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Helper
      operationId: grantHelperAccess
      summary: Grant case-specific helper access
      description: Citizen owner only. Creates or explicitly reactivates a helper grant.
        Existing grants return 200. Consent is a separate required gate.
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaint_access_grants
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaint_access_grants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/HelperGrantCreate
  /api/v1/complaints/{id}/helper-grants/{helper_id}/revoke:
    parameters:
    - *id001
    - name: helper_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    post:
      tags:
      - Helper
      operationId: revokeHelperAccess
      summary: Revoke helper access
      description: Citizen owner only. Idempotently blocks future helper access even
        if consent remains granted.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaint_access_grants
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/admin/complaints/{id}/assignment:
    parameters: *id002
    post:
      tags:
      - Admin
      operationId: assignOfficer
      summary: Assign an officer to a submitted case
      description: 'Admin. Requires an already submitted/reviewing case, pinned route,
        active officer in the routed workspace, and current workspace consent. Returns
        assignment metadata only; conveys no access to incident data. API-key scope:
        admin:cases.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/case_assignments
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/OfficerAssignmentCreate
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: Process is running. All reporting services are simulated.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Health'
  /api/v1/health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check database connectivity and current migration readiness
      security: []
      responses:
        '200':
          description: Database is accessible and all current migrations are applied.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate
      description: 'Public login for Citizen, Helper, Officer and Admin using their own credentials.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Login'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          description: Too many login attempts. Retry-After gives the delay in seconds.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Error'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getMe
      summary: Get the signed-in account
      description: 'Citizen, Helper, Officer or Admin. Returns the calling account.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/users'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/complaints:
    post:
      tags:
      - Citizen complaints
      operationId: createComplaint
      summary: Create a complaint draft
      description: Citizen. The authenticated citizen owns the new draft. Optional Idempotency-Key
        prevents duplicate draft creation on retries. Identical replay returns the current
        draft with 200; conflicting reuse returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/IncidentInformation
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '409':
          $ref: '#/components/responses/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Use one opaque key for retries of the same citizen's draft creation.
          A different payload with the same key conflicts.
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      tags:
      - Citizen complaints
      operationId: listComplaints
      summary: List my complaints
      description: Citizen. Returns only the caller’s own cases.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas.yaml#/components/schemas/complaints
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/complaints/{id}:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    get:
      tags:
      - Citizen complaints
      operationId: getComplaint
      summary: Read a complaint
      description: Citizen who owns the case or Helper with a specific active grant
        and applicable consent. Return only information the caller may read.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Citizen complaints
      operationId: updateComplaint
      summary: Correct or complete a draft
      description: Citizen who owns the case. Omitted fields remain unchanged. Explicit
        null records an unknown value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/IncidentPatch
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - name: If-Match
        in: header
        required: false
        description: Optional quoted content version, e.g. "1". A stale version returns
          412. On retry after an uncertain save, GET the draft and reconcile before
          retrying.
        schema:
          type: string

  /api/v1/complaints/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/complaint_idPath'
    post:
      tags: [Citizen complaints]
      operationId: uploadEvidence
      summary: Attach supporting evidence
      description: 'Citizen who owns the case or Helper with a specific active grant and applicable consent. Validate size, type and contents. Accept images and PDFs. Store the original privately and record its hash.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: './schemas.yaml#/components/schemas/EvidenceUpload'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/evidence'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/analyze:
    parameters:
      - $ref: '#/components/parameters/complaint_idPath'
    post:
      tags: [Citizen complaints]
      operationId: analyzeComplaint
      summary: Analyze the saved incident
      description: Citizen who owns the case. Uses the saved incident to classify it and determine readiness or handoff.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/Analysis'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/authorize-submission:
    parameters:
      - $ref: '#/components/parameters/complaint_idPath'
    post:
      tags: [Citizen complaints]
      operationId: authorizeSubmission
      summary: Authorize the reviewed complaint
      description: 'Citizen who owns the case. Requires review and active consent covering the recipient, data and purpose. Record explicit authorization and recheck consent before sharing.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/AuthorizeSubmission'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/complaints'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/consents:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    get:
      tags:
      - Consent
      operationId: listConsents
      summary: List case consent records
      description: Citizen who owns the complaint.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas.yaml#/components/schemas/consents
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Consent
      operationId: grantConsent
      summary: Grant data-sharing consent
      description: Citizen who owns the complaint. Derive the grantor from the authenticated
        citizen. One active consent per complaint/recipient/purpose is allowed; duplicate
        grants return 409. Recipient and purpose use the shared namespaced format and
        controlled enums. case_status is required to expose the case envelope; incident
        fields are filtered to the remaining scopes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/ConsentGrant
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/consents
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/consents/{id}:
    parameters:
      - $ref: '#/components/parameters/consent_idPath'
    patch:
      tags: [Consent]
      operationId: changeConsent
      summary: Change a consent record
      description: 'Citizen who owns the associated complaint. Apply the changed recipient, purpose or scope immediately.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ConsentChange'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/consents'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/consents/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/consent_idPath'
    post:
      tags: [Consent]
      operationId: withdrawConsent
      summary: Withdraw consent
      description: Citizen who owns the associated complaint. Block future access under this consent immediately and record withdrawal.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/consents'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/helper/complaints:
    get:
      tags: [Helper]
      operationId: listHelperComplaints
      summary: Track authorized complaints
      description: Helper. Include only cases covered by a specific active grant and current consent. Filter each case to the authorized data scope.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/complaints'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/complaints/{id}/helper-information:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    post:
      tags:
      - Helper
      operationId: addHelperInformation
      summary: Add information to an authorized case
      description: Helper. Recheck the specific active grant and current consent. Updates
        only incident information within scope. Return only authorized case fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/components/schemas/HelperInformation
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
      parameters:
      - name: If-Match
        in: header
        required: false
        description: Optional quoted content version, e.g. "1". A stale version returns
          412. On retry after an uncertain save, GET the draft and reconcile before
          retrying.
        schema:
          type: string

  /api/v1/officer/complaints:
    get:
      tags: [Officer]
      operationId: listOfficerComplaints
      summary: List assigned complaints
      description: Officer. Include only cases assigned to the caller within their workspace and permitted case scope.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/complaints'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/officer/complaints/{id}:
    parameters:
    - $ref: '#/components/parameters/complaint_idPath'
    get:
      tags:
      - Officer
      operationId: getOfficerComplaint
      summary: Review an assigned complaint
      description: Officer. Requires assignment, matching workspace and permitted case
        scope. Evidence access also requires current authorization.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: ./schemas.yaml#/components/schemas/complaints
          headers:
            ETag:
              description: Quoted complaint content version, e.g. "1".
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/officer/complaints/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/complaint_idPath'
    post:
      tags: [Officer]
      operationId: takeOfficerAction
      summary: Record a review decision
      description: 'Officer. Requires assignment, matching workspace and permitted case scope. The officer supplies the action and reason.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/OfficerDecision'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/complaints'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users
      description: Admin. User and role management.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/users'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a user
      description: Admin. Set the role and workspace association.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/users'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/admin/routing-rules:
    get:
      tags: [Admin]
      operationId: listRoutingRules
      summary: List current routing rules
      description: Admin. Routing management.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/routing_rules'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      operationId: createRoutingRule
      summary: Create a routing rule
      description: Admin. Creates the first immutable version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/RuleCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/routing_rules'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/admin/routing-rules/{id}:
    parameters:
      - $ref: '#/components/parameters/rule_idPath'
    patch:
      tags: [Admin]
      operationId: updateRoutingRule
      summary: Revise a routing rule
      description: Admin. Creates an immutable version for subsequent routing. Previously routed cases retain their version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/RuleChange'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/routing_rules'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/admin/audit:
    get:
      tags: [Admin]
      operationId: listAudit
      summary: Inspect audit history
      description: Admin. Read-only trace access. Return authorized summaries and protect private evidence.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schemas.yaml#/components/schemas/audit_logs'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/admin/agent-runs:
    get:
      tags: [Admin]
      operationId: listAgentRuns
      summary: Inspect agent runs
      description: Admin. Read-only inspection. Return only runs whose data the administrator is authorized to inspect.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
