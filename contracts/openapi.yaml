        payload; conflicting reuse is 409. Every sensitive step checks current account,
        case binding and relevant consent. Persisted flags never substitute for authorization.
        Unknown payment references are warnings, not proof of invalidity. An uncertain
        save returns 503: read saved progress/confirmation before retrying the same
        key. Completed owner-side results may be read from the saved copy without
        repeating service access.'
  /api/v1/complaints/{id}/agent-runs:
    parameters:
