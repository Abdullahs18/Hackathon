components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scopes grant access by resource area, such as complaints:read or
        admin:rules. A key carries only the authority of its principal.
  parameters:
    complaint_idPath:
      name: id
      in: path
      required: true
      description: Identifies complaint_id.
      schema:
        type: string
        minLength: 1
    consent_idPath:
      name: id
      in: path
      required: true
      description: Identifies consent_id.
      schema:
        type: string
        minLength: 1
    rule_idPath:
      name: id
      in: path
      required: true
      description: Identifies rule_id.
      schema:
        type: string
        minLength: 1
    api_key_idPath:
      name: id
      in: path
      required: true
      description: Identifies api_key_id.
      schema:
        type: string
        minLength: 1
    identity_referencePath:
      name: reference
      in: path
      required: true
      description: Identifies identity_reference.
      schema:
        type: string
        minLength: 1
    transaction_referencePath:
      name: reference
      in: path
      required: true
      description: Identifies transaction_reference.
      schema:
        type: string
        minLength: 1
    incident_typePath:
      name: incident_type
      in: path
      required: true
      description: Identifies incident_type.
      schema:
        type: string
        minLength: 1
    idempotency_keyPath:
      name: key
      in: path
      required: true
      description: Identifies idempotency_key.
      schema:
        type: string
        minLength: 1
    notification_idPath:
      name: id
      in: path
      required: true
      description: Identifies notification_id.
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: The HTTP status identifies the failure. 400 indicates invalid input,
        401 invalid credentials, 403 insufficient authority or consent, 404 a missing
        resource, and 409 a conflicting request or case state. The body contains a
        machine-readable error and a safe explanation.
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/components/schemas/Error
