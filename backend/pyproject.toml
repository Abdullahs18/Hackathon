[project]
name = "dastak-backend"
version = "0.1.0"
description = "Dastak synthetic complaint reporting backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "pydantic-settings",
  "pwdlib[argon2]",
  "PyJWT",
  "PyYAML",
  "google-genai>=3.6.1",
  "gtts>=2.5.4",
  "jsonschema>=4.26.0",
  "mutagen>=1.48.1",
]

[dependency-groups]
dev = [
 "pytest",
 "ruff",
 "openapi-spec-validator",
 "httpx2>=2.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
