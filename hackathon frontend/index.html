<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f5132" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dastak — Assisted Fraud Reporting (Hackathon Prototype)</title>
    <script>
      // Apply saved theme + language before first paint (no flash, no layout jump).
      (function () {
        try {
          var d = document.documentElement;
          var th = localStorage.getItem('dastak.theme');
          if (!th) th = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (th === 'dark') d.classList.add('dark');
          if (localStorage.getItem('dastak.lang') === 'ur') { d.lang = 'ur'; d.dir = 'rtl'; }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
